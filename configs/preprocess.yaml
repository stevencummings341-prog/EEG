# Preprocessing PARAMETERS only. Filesystem paths live in configs/paths.yaml.
# See docs/PREPROCESSING_SPEC.md. Validated on sub-001/ses-01 vs the paper .mat.

# mode: which preprocessing pipeline to run (canonical key; "variant" is the old alias).
#   "eog_ecg_clean" — FORMAL output of the current stage: EOG/ECG-assisted ICA cleaning,
#                     then the paper-style second half. Writes ONE .npz per session.
#   "paper_style"   — legacy single-session sanity check (no ICA). Not the formal output.
mode: "eog_ecg_clean"

# --- formal output format (current stage = npz, not X.npy + y.npy) ---
output:
  format: "npz"             # per-session .npz: sub-XXX_ses-YY_task-motorimagery_eeg.npz
  npz_compress: true        # np.savez_compressed (saves space on the shared workspace)
  save_debug_npy: false     # debug-only extra X.npy/y.npy; DEFAULT OFF
  write_manifest_row: true  # also drop a per-session manifest_row.json

# --- EOG/ECG-assisted denoising (mode=eog_ecg_clean) ---
# Use the REAL channel names (ECG; HEOR/HEOL/VEOU/VEOL) — never the swapped JSON counts.
aux_cleaning:
  enabled: true
  method: "ica"             # supported: "ica" (regression reserved for later)
  fallback: "no_aux_clean"  # if ICA / detection fails: degrade to no-aux clean
  validity:                 # an aux channel must pass ALL of these to be used (units: µV)
    min_std_uv: 0.001       # std below this => treated as flat / invalid
    min_ptp_uv: 0.01        # peak-to-peak below this => invalid
  ica:
    n_components: 0.99      # passed to MNE ICA (float = variance kept, int = #components)
    n_components_fallback: 15   # if the float collapses (e.g. 1 PCA comp ~99% var), refit w/ this int
    method: "fastica"
    max_iter: "auto"
    random_state: 97
    decim: 3                # subsample when fitting (1 Hz high-passed copy; speeds up fit)
    highpass_for_fit: 1.0   # high-pass (Hz) applied ONLY to the ICA-fitting copy
    # Artifact-component detection uses ABSOLUTE correlation (interpretable + robust):
    # flag an IC when |corr(IC, aux-channel)| exceeds the threshold. (z-score is the MNE
    # default but was too conservative here; ctps found no ECG comps on this data.)
    eog_measure: "correlation"
    eog_threshold: 0.5      # |corr| with EOG above this => excluded as ocular
    ecg_method: "correlation"   # robust for a strong ECG channel (falls back to ctps on error)
    ecg_measure: "correlation"
    ecg_threshold: 0.5      # |corr| with ECG above this => excluded as cardiac

# --- channel handling (VERIFIED via scripts/check_raw_bdf.py) ---
# Reality: 59 EEG + 1 ECG + 4 EOG. (task-motorimagery_eeg.json's EOG/ECG counts are
# SWAPPED vs the real names; trust the names.)
channels:
  n_eeg: 59
  n_eog: 4                  # HEOR/HEOL/VEOU/VEOL
  n_ecg: 1                  # ECG
  reference: "Pz"           # re-reference to Pz (EEGLAB ch 43), then drop it -> 58 EEG
  drop_after_ref: ["Pz"]
  expected_final_eeg: 58
  eog_names: ["HEOR", "HEOL", "VEOU", "VEOL"]
  ecg_names: ["ECG"]

# --- filtering ---
filter:
  l_freq: 0.5
  h_freq: 40.0
  notch_freq: 50.0

# --- epoching (window/baseline confirmed from preprocessed.m) ---
epoch:
  event_values: [1, 2]      # 1=left-hand, 2=right-hand (2C)
  label_map: {1: 0, 2: 1}   # original trigger -> internal label
  tmin: 0.0                 # window starts at the trigger
  tmax: 4.0                 # 4 s (code uses tmax-1/sfreq -> 4000 samples @1000Hz)
  baseline: null            # code uses whole-epoch demean (None, None)
  expected_trials: 200
  expected_per_class: 100
  units: uV                 # MNE returns µV-magnitude (BDF dim '?V' not rescaled); store as-is

# --- resampling ---
resample:
  raw_sfreq: 1000           # informational; actual read from the file
  target_sfreq: 250

# --- output expectation (assert; fail loudly on mismatch) ---
expect_shape: [200, 58, 1000]   # [trials, channels, time]

# --- misc ---
seed: 42
strict: true               # raise on any shape/trial-count mismatch

# --- cross-check (optional) ---
# Compare produced labels/trials against the paper .mat in derivatives/.
validate_against_mat: true
