# Experiment C: online test-then-update adaptation (Stage 5).
# Prequential evaluation on target Session 2 then Session 3.
# See docs/EXPERIMENT_PROTOCOL.md and the chat record (sec. 7-12).

run_id: "online_v0"

data:
  processed_dir: "data/processed_paper_style"
  n_channels: 58
  n_times: 1000
  n_classes: 2
  online_sessions: [2, 3]     # processed in temporal order, trial by trial

init:
  # where the online run starts from
  checkpoint: ""              # pretrained (and optionally Session-1 fine-tuned)
  finetune_session1_first: true

# IRON RULE: for each trial -> predict, record, THEN update. Never train before eval.
online:
  label_mode: "supervised"    # supervised | unsupervised(pseudo-label)
  confidence_threshold: 0.85  # unsupervised: only update if confidence > threshold
  # which lightweight modules may update online (backbone stays frozen):
  update_modules:
    prototype_memory: true
    adapter: true
    calibration_head: true
    bn_stats: true            # causal update only
    classifier_head: false    # only when supervised labels are available
    backbone: false           # never by default
  lr: 0.0001
  prototype_momentum: 0.9
  # stability safeguards (chat record sec. 11)
  ema_teacher: true
  ema_decay: 0.99
  replay_memory_size: 200
  class_balanced_memory: true
  entropy_regularization: 0.01
  feature_distillation: true
  lr_decay: true

eval:
  metrics: ["accuracy", "balanced_accuracy", "macro_f1"]
  calibration_metrics: ["ece", "nll", "brier"]
  curves: ["performance_vs_trial", "risk_coverage"]
  per_trial_csv: true         # outputs/<run_id>/per_trial.csv
  report_pre_vs_post: true

logging:
  out_dir: "outputs"
  checkpoint_dir: "checkpoints"
  seed: 42
  device: "cuda"
