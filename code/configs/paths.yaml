# Central path configuration. ALL filesystem paths come from here (or env vars).
# Never hard-code data paths in Python. Loaded by src/utils/paths.load_paths().
# Env override: SHU_2C_ROOT overrides raw_data.shu_2c_root.
#
# NOTE: shu_2c_root below is the VERIFIED external location on this server. If you
# move the data or run elsewhere, change it here (or set SHU_2C_ROOT). The loader
# raises a clear error if it is missing, a placeholder, or does not exist.

raw_data:
  # External, READ-ONLY SHU 2C dataset root (BIDS). Outside this project.
  shu_2c_root: "/share/workspace2/moto_imagination/WBCIC_SHU"
  # Subdirs under the root (the literal space in "2C dataset" is intentional).
  raw_subdir: "sourcedata/2C dataset"
  # Paper-processed .mat — used ONLY as a label/event cross-check, not as data entry.
  derivatives_subdir: "derivatives/2C dataset_processeddata"

processed_data:
  # Where Python preprocessing writes [200,58,1000] tensors. Relative paths resolve
  # against the project root; absolute paths (e.g. the external workspace below) are
  # used as-is. These dirs are CREATED if missing and must be WRITABLE (loader checks).
  #
  # paper_style_root: retained for the old single-session sanity check ONLY. It is NOT
  #   the primary output of the formal stage; do not point new runs here.
  paper_style_root: "outputs/processed_paper_style"
  # eog_ecg_clean_root: the FORMAL output of the current stage (EOG/ECG-assisted clean).
  #   Lives OUTSIDE the repo on the shared workspace, in a dedicated processed/ subtree
  #   (never under sourcedata/ or derivatives/ — the loader refuses those).
  eog_ecg_clean_root: "/share/workspace2/moto_imagination/WBCIC_SHU/processed/eog_ecg_clean"

manifests:
  raw_manifest: "manifests/shu_2c_raw_manifest.csv"
  # Formal processed manifest now sits NEXT TO the npz outputs (one row per session,
  # records npz_path — not X_path/y_path). preprocess_all.py also writes
  # preprocess_summary.csv beside it.
  processed_manifest: "/share/workspace2/moto_imagination/WBCIC_SHU/processed/eog_ecg_clean/processed_manifest.csv"

splits:
  dir: "splits"
