experiment:
  name: "phase0_drift_diagnostic"
  source_config: "configs/session_drift.yaml"

# =====================================================================
# Session-drift diagnostic (direction A) configuration.
#
# This file holds ONLY analysis parameters + output location + an optional
# smoke-test subset. All filesystem paths come from configs/paths.yaml:
#   - data_root = paths.eog_ecg_clean_root  (the eog_ecg_clean_v1 .npz tree)
#   - manifest  = paths.processed_manifest  (processed_manifest.csv)
# Only status=ok sessions are used (5 failed sessions excluded). Never write to
# raw / workspace2 originals; all outputs go under outputs/.
#
# Run: see docs/SESSION_DRIFT_ANALYSIS.md
#   python scripts/analysis/run_session_drift.py --config configs/session_drift.yaml \
#       --subjects 1,2          # smoke test
# =====================================================================

run_id: "session_drift_v1"

data:
  variant: "eog_ecg_clean"          # -> paths.eog_ecg_clean_root (data_root)
  manifest: "processed_manifest"    # -> paths.processed_manifest (processed_manifest.csv)
  status_filter: ["ok"]             # ONLY status=ok sessions (148 ok / 5 failed)
  sfreq: 250                        # Hz (informational; npz also carries sfreq)
  n_channels: 58
  n_times: 1000

bands:
  # MI-relevant rhythms. Units = Hz.
  mu: [8, 13]
  beta: [13, 30]

# Drift metrics computed for every within-subject session pair (i<j, undirected).
metrics:
  - mmd                # RBF-kernel Maximum Mean Discrepancy on flattened trials
  - coral              # CORAL: channel-covariance Frobenius distance
  - mu_power_shift     # log10 mu-band power difference (ses_j - ses_i)
  - beta_power_shift   # log10 beta-band power difference
  - ks                 # 2-sample Kolmogorov-Smirnov stat on mu-power distributions
  - erd_ers_corr       # ERD/ERS spatial-pattern Pearson corr (mu & beta)
  - csp_similarity     # |cosine| similarity of per-session CSP spatial filters
  - rms_ratio          # per-channel RMS ratio (ses_j / ses_i), median + std
  - fisher_shift       # MI separability (Fisher ratio) shift across sessions

params:
  mmd_subsample: 100      # max trials/session sampled for MMD (speed; <=200)
  csp_components: 4       # CSP filters per session for similarity
  erd_baseline_ratio: 0.25  # first 25% of each trial = ERD/ERS baseline window
  seed: 0                 # RNG seed (MMD subsampling) for reproducibility

output:
  output_dir: "outputs/analysis/session_drift_v1"

# Optional smoke-test subset. CLI --subjects / --max-subjects override these.
subset:
  subjects: null          # e.g. [1, 2] to restrict to sub-001, sub-002
  max_subjects: null       # e.g. 5 to cap the number of subjects processed
