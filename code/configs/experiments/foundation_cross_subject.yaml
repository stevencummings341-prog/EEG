experiment:
  name: "foundation_cross_subject"      # -> code.runners.run_foundation_cross_subject
  source_config: "configs/experiments/foundation_cross_subject.yaml"

# =====================================================================
# WBCIC-SHU 2025 — end-to-end foundation models, CROSS-SUBJECT evaluation.
#
# New mainline (2026-08-04, advisor's re-scope): drop online/TTA for now and train the
# 5 S4 / DINO-DualCD variants end to end. WBCIC-SHU (58ch) and SHU 2022 (32ch) are
# trained SEPARATELY — never merged — so each dataset keeps its own baseline; see the
# sibling config `shu_foundation_cross_subject.yaml`.
#
# ⚠ PROTOCOL STATUS: pending_advisor_confirmation.
#   The split/epoch/seed numbers below are a defensible default, NOT an agreed protocol.
#   The open questions and the literature survey they come from are in
#   `inbox/cross_subject_protocol_research.md` +
#   `4_experiments/CROSS_SUBJECT_PROTOCOL_MEMO.md`. Confirm with the advisor before
#   quoting any number from a full run as a result.
#
# Run:
#   # plan only
#   python code/run.py --dry-run --config code/configs/experiments/foundation_cross_subject.yaml
#   # CPU smoke (tiny): 4 subjects, 1 fold, 2 epochs
#   python code/run.py --config code/configs/experiments/foundation_cross_subject.yaml \
#       --models s4erp --split-protocol kfold_subject --folds 2 --folds-subset 0 \
#       --max-subjects 4 --max-epochs 2 --batch-size 8 --device cpu \
#       --out outputs/experiments/wbci_shu/foundation_cross_subject_smoke
#   # full run on a GPU node (Slurm, mi_torch_cu118); re-running resumes automatically
#   python code/run.py --config code/configs/experiments/foundation_cross_subject.yaml --device cuda
# =====================================================================

run_id: "foundation_cross_subject_v1"

data:
  name: "wbci_shu"
  variant: "eog_ecg_clean"
  manifest: "processed_manifest"       # -> paths.processed_manifest (status=ok only)
  status_filter: ["ok"]
  n_channels: 58
  n_times: 1000                        # 4 s epoch [0,4) after the MI cue @ 250 Hz
  n_classes: 2                         # left vs right hand MI, labels normalized to {0,1}
  sfreq: 250

# Order matters: the runner trains in this order, so the cheap supervised variant
# validates the pipeline before the expensive DualCD ones start.
models: ["s4erp", "dualcd_s4_pos", "dualcd_s4_timepatch", "dualcd_s4_flatten", "dualcd_transformer"]

cross_subject:
  protocol: "kfold_subject"      # loso | kfold_subject | holdout
  n_folds: 5                     # 5 subject-disjoint groups; each is the test group once
  split_seed: 0                  # fold membership depends only on this, not on train seeds
  val_mode: "subjects"           # subjects = held-out TRAIN subjects (strict, no subject leak)
  val_subject_fraction: 0.15     # ~15% of the remaining subjects used for model selection
  # n_val_subjects: 6            # absolute alternative to val_subject_fraction
  # holdout-only keys:
  # test_subjects: ["sub-001", "sub-002"]
  # val_subjects:  ["sub-003"]
  # test_fraction: 0.2

train:
  batch_size: 64
  lr: null                       # null -> per-variant default (s4erp 1e-3, DualCD 1e-4)
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"            # CosineAnnealingLR(T_max=max_epochs)
  max_epochs: 100                # source package suggests 100-300 (s4erp) / 200-300 (DualCD)
  early_stopping_patience: 25
  monitor: "macro_f1"            # picks best.pt on the validation subjects
  monitor_mode: "max"
  grad_clip_norm: 4.0
  normalization: "per_sample_zscore"   # fit-free per trial => no train/test leakage
  num_workers: 2
  amp: false
  device: "cuda"                 # GPU via Slurm only; fail-fast if cuda is unavailable
  seeds: [0]                     # extend to [0,1,2] once the protocol is confirmed

# Structural hyperparameters per variant (mirrors code/configs/models/<name>.yaml).
model_params:
  s4erp: {d_model: 128, n_layers: 4, state_dim: 8, d_ff: 256, dropout: 0.1}
  dualcd_s4_pos: {d_model: 128, n_layers: 4, state_dim: 8, d_ff: 256, dropout: 0.1,
                  lambda_intra: 0.5, dino_out_dim: 256, proto_k: 5,
                  teacher_momentum: 0.996, warmup_epochs: 5,
                  view_low_band: [8.0, 13.0], view_high_band: [13.0, 30.0]}
  dualcd_s4_timepatch: {d_model: 128, n_layers: 4, state_dim: 8, d_ff: 256, dropout: 0.1,
                        lambda_intra: 0.5, dino_out_dim: 256, proto_k: 5,
                        teacher_momentum: 0.996, warmup_epochs: 5,
                        view_low_band: [8.0, 13.0], view_high_band: [13.0, 30.0],
                        bin_boundaries_ms: [0, 500, 1000, 1500, 2000, 3000, 4000],
                        use_std: true}
  dualcd_s4_flatten: {d_model: 128, n_layers: 4, state_dim: 8, d_ff: 256, dropout: 0.1,
                      lambda_intra: 0.5, dino_out_dim: 256, proto_k: 5,
                      teacher_momentum: 0.996, warmup_epochs: 5,
                      view_low_band: [8.0, 13.0], view_high_band: [13.0, 30.0]}
  dualcd_transformer: {d_model: 128, n_layers: 6, n_heads: 8, d_ff: 256, dropout: 0.1,
                       lambda_intra: 0.5, dino_out_dim: 256, proto_k: 5,
                       teacher_momentum: 0.996, warmup_epochs: 5,
                       view_low_band: [8.0, 13.0], view_high_band: [13.0, 30.0]}

eval:
  metrics: ["accuracy", "balanced_accuracy", "macro_f1", "auc"]
  calibration_metrics: ["nll", "brier", "ece"]
  # Both checkpoints are scored on every held-out subject: `accuracy` etc. come from
  # best.pt, `last_accuracy` etc. from the final epoch.
  report_scope: "per_test_subject"

checkpoints:
  keep: ["best", "last"]         # enforced by code/training/e2e_trainer.py
  resume: true                   # `--no-resume` retrains a cell from scratch

output:
  output_dir: "outputs/experiments/wbci_shu/foundation_cross_subject_v1"
  checkpoint_dir: "checkpoints/wbci_shu/foundation_cross_subject_v1"
