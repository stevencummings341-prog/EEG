# SHU 2022 motor imagery dataset (read-only external source).
name: "shu"
description: "SHU 2022 -- 25 subjects x 5 sessions x 32 EEG channels"
paper: "Ma et al., Scientific Data, 2022"
data_dir: "/share/workspace2/moto_imagination/SHU"
# 正式训练入口 = 预处理后的 per-session .npz（由 scripts/preprocess_shu.py 生成）。
# .mat 为作者发布的预处理数据（[n,32,1000] µV, 250Hz），直接归一化标签后落盘为 .npz。
processed_root: "/share/workspace2/moto_imagination/SHU/processed/npz_clean"
manifest: "/share/workspace2/moto_imagination/SHU/processed/npz_clean/processed_manifest.csv"
status_filter:
- ok
n_channels: 32
n_timepoints: 1000
n_classes: 2
sfreq: 250.0
sessions_per_subject: 5
electrode_system: "10-20/10-10"
task: "2-class motor imagery: left vs right hand grasping"
read_only: true
source_files:
  eeg: "sub-*_ses-*_task_motorimagery_eeg.edf|mat"
  events: "sub-*_ses-*_task_motorimagery_events.tsv"
  metadata: "dataset_description.json, participants.tsv, task-motorimagery_channels.tsv"
channels:
  - "FP1"
  - "FP2"
  - "FZ"
  - "F3"
  - "F4"
  - "F7"
  - "F8"
  - "FC1"
  - "FC2"
  - "FC5"
  - "FC6"
  - "CZ"
  - "C3"
  - "C4"
  - "T3"
  - "T4"
  - "A1"
  - "A2"
  - "CP1"
  - "CP2"
  - "CP5"
  - "CP6"
  - "PZ"
  - "P3"
  - "P4"
  - "T5"
  - "T6"
  - "PO3"
  - "PO4"
  - "OZ"
  - "O1"
  - "O2"
