# Main experiment: 41/10 cross-subject pretraining of CAP-EEGNet (Stage: later).
# Split by SUBJECT, repeat over seeds. Filesystem paths come from configs/paths.yaml.
# See docs/EXPERIMENT_PROTOCOL.md and docs/MODEL_PLAN.md.
# NOTE: training is NOT implemented yet (current stage = data/paths/preprocessing).

run_id: "cap_eegnet_4110"       # split files: splits/cap_eegnet_4110_seed<k>.json

data:
  variant: "eog_ecg_clean"      # formal entry = status=ok .npz under eog_ecg_clean_root
  n_channels: 58
  n_times: 1000
  n_classes: 2
  use_sessions: [1, 2, 3]       # train on all source ok sessions; test all target sessions
  statuses: ["ok"]              # only status==ok sessions; failed sessions are excluded

split:
  n_source_subjects: 41
  n_target_subjects: 10
  # subject-wise (NEVER trial/session-wise). target subjects need all 3 sessions ok.
  seeds: [2026, 2027, 2028, 2029, 2030]   # repeated splits; report mean +/- std
  # generate via: python scripts/make_splits.py --seeds 2026 2027 2028 2029 2030
  # persisted to <paths.splits.dir>/<run_id>_seed<k>.json
  target_finetune_sessions: [1]           # Session 1 fine-tuning (Experiment 2)
  target_online_sessions: [2, 3]          # Session 2/3 online test-then-update (Experiment 3)

model:
  name: "cap_eegnet"            # Confidence-aware Prototype EEGNet
  encoder:
    F1: 8
    D: 2
    F2: 16
    kernel_length: 64
    dropout: 0.25
  adapter:
    enabled: true
    bottleneck: 16
  prototype_head:
    enabled: true
    levels: ["global", "subject", "session"]
    momentum: 0.9
  confidence_head:
    enabled: true
    sources: ["entropy", "prototype_margin", "consistency", "calibration"]

loss:
  cls_weight: 1.0
  prototype_weight: 0.5
  confidence_weight: 0.5
  consistency_weight: 0.0
  domain_weight: 0.0

train:
  epochs: 300
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  optimizer: "adam"
  scheduler: "cosine"
  balance_subject_class: true   # batch balancing across subject/class (cross-subject)
  seed: 42
  device: "cuda"                # GPU via Slurm only; fail fast if cuda unavailable
  num_workers: 8

eval:
  metrics: ["accuracy", "balanced_accuracy", "macro_f1", "auc"]
  calibration_metrics: ["ece", "nll", "brier"]
  report: "mean_std_over_seeds"

logging:
  out_dir: "outputs"
  checkpoint_dir: "checkpoints"
