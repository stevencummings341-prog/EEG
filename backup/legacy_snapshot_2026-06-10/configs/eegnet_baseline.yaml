# EEGNet baseline (Stage 2). Single-session sanity check first, then subject-wise.
# See docs/MODEL_PLAN.md (v0). No prototype/confidence yet — plain classifier.

run_id: "eegnet_baseline_v0"

data:
  variant: "paper_style"        # processed dir comes from configs/paths.yaml
  n_channels: 58
  n_times: 1000
  sfreq: 250
  n_classes: 2
  # evaluation mode: "single_session" | "within_subject" | "subject_wise"
  mode: "single_session"
  # for the first sanity check, pick one subject/session:
  sanity_subject: "sub-001"
  sanity_session: "ses-01"
  val_fraction: 0.2
  test_fraction: 0.2

model:
  name: "eegnet"           # one of: eegnet | deepconvnet | fbcnet
  # EEGNet hyperparameters (Lawhern et al. 2018), adapted to 58 ch / 250 Hz.
  F1: 8
  D: 2
  F2: 16
  kernel_length: 64        # ~ sfreq/4 for temporal conv
  dropout: 0.25
  dropout_type: "Dropout"

train:
  epochs: 200
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  optimizer: "adam"
  scheduler: null
  early_stopping_patience: 30
  seed: 42
  device: "cuda"           # GPU jobs only; fail fast if cuda unavailable
  num_workers: 4

logging:
  out_dir: "outputs"
  checkpoint_dir: "checkpoints"
  metrics: ["accuracy", "balanced_accuracy", "macro_f1"]
  save_every: 0            # 0 = only best + last
