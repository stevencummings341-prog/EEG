# =====================================================================
# Unified model-comparison framework (directions B + C) configuration.
#
# ONE protocol, ONE data filter, ONE metric set shared by ALL models so the
# baseline-vs-CAP-EEGNet comparison is fair and leakage-free. Filesystem paths
# come from configs/paths.yaml:
#   - data_root = paths.eog_ecg_clean_root
#   - manifest  = paths.processed_manifest  (status=ok filter)
# Results -> outputs/, weights -> checkpoints/. Never write raw / workspace2.
#
# Two evaluation protocols (NO LOSO right now — future work):
#   within : per ok-session Stratified K-fold CV (upper bound; no drift)
#   cross  : train on session i, test on session j (same subject, both ok),
#            directed pairs -> measures cross-session drift
#
# Run: see docs/BASELINE_PROTOCOL.md
#   python scripts/train_session_models.py --config configs/session_model_compare.yaml \
#       --models eegnet,deepconvnet,fbcnet,cap_eegnet --protocol within \
#       --subjects 1,2 --folds 2 --max-epochs 3 --device cuda   # smoke test
# =====================================================================

run_id: "session_model_compare_v1"

data:
  variant: "eog_ecg_clean"          # -> paths.eog_ecg_clean_root
  manifest: "processed_manifest"    # -> paths.processed_manifest
  status_filter: ["ok"]             # ONLY status=ok sessions
  n_channels: 58
  n_times: 1000
  n_classes: 2
  sfreq: 250
  # Labels are normalized to {0,1} (left=0, right=1) regardless of npz storing
  # {0,1} or {1,2}. See src/data/session_splits.normalize_labels.

protocols: ["within", "cross"]
# CURRENT MAINLINE (2026-06-07): the THREE baseline architectures only.
# CAP-EEGNet (v1/v2) is kept in code but is OPTIONAL / FUTURE work, along with all
# agent/toolkit/prototype/confidence/online/fine-tuning modules — do not run them in the
# current mainline. To run CAP-EEGNet later, add "cap_eegnet" here or pass --models on the CLI.
models: ["eegnet", "deepconvnet", "fbcnet"]
# optional_future_models: ["cap_eegnet"]

within:
  folds: 10                  # StratifiedKFold within each ok session (label-balanced)

cross:
  directed_pairs: true       # train ses-i -> test ses-j (both ok, same subject)

train:
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0
  optimizer: "adam"          # adam | adamw | sgd
  max_epochs: 100            # CLI --max-epochs overrides (smoke test uses 3)
  early_stopping_patience: 20
  early_stopping_metric: "val_loss"   # monitored on a held-out val slice of train
  val_fraction: 0.2          # fraction of the TRAIN split used for early stopping
  num_workers: 2
  device: "cuda"             # GPU via Slurm only; fail-fast if cuda unavailable
  seeds: [0]                 # >=1 seed; extend (e.g. [0,1,2]) for mean+/-std later

# Per-model structural hyperparameters. Sources documented in each src/models/*.py.
model_params:
  eegnet:      {F1: 8, D: 2, F2: 16, kernel_length: 64, dropout: 0.25}
  deepconvnet: {dropout: 0.5, n_filters_1: 25}
  fbcnet:      {n_bands: 9, band_width: 4, f_low: 4, f_high: 40, m: 32,
                temporal_segments: 4, dropout: 0.5}
  # CAP-EEGNet v1: EEGNet encoder + classifier + lightweight LEARNED confidence head.
  # Prototype/subagents/adapter/domain/online are NOT implemented (future work).
  cap_eegnet:  {F1: 8, D: 2, F2: 16, kernel_length: 64, dropout: 0.25,
                use_confidence: true, confidence_weight: 0.1}

eval:
  metrics: ["accuracy", "balanced_accuracy", "macro_f1", "auc"]
  calibration_metrics: ["nll", "brier", "ece"]

output:
  output_dir: "outputs/experiments/session_model_compare_v1"
  checkpoint_dir: "checkpoints/session_model_compare_v1"
