# Multi-source cross-session baseline (Step 1): train ses-01 + ses-02 -> test ses-03.
#
# Reuses the same data filter, model params, trainer recipe, and metrics as
# session_model_compare.yaml. Only status=ok sessions are used. Subjects missing any
# of ses-01/ses-02/ses-03 are skipped and recorded.

run_id: "session_multisource_v1"

data:
  variant: "eog_ecg_clean"
  manifest: "processed_manifest"
  status_filter: ["ok"]
  n_channels: 58
  n_times: 1000
  n_classes: 2
  sfreq: 250

models: ["eegnet", "deepconvnet", "fbcnet"]

multisource:
  train_sessions: ["ses-01", "ses-02"]
  test_session: "ses-03"

train:
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0
  optimizer: "adam"
  max_epochs: 100
  early_stopping_patience: 20
  early_stopping_metric: "val_loss"
  val_fraction: 0.2
  num_workers: 2
  device: "cuda"
  seeds: [0, 1, 2, 3, 4]

model_params:
  eegnet:      {F1: 8, D: 2, F2: 16, kernel_length: 64, dropout: 0.25}
  deepconvnet: {dropout: 0.5, n_filters_1: 25}
  fbcnet:      {n_bands: 9, band_width: 4, f_low: 4, f_high: 40, m: 32,
                temporal_segments: 4, dropout: 0.5}

eval:
  metrics: ["accuracy", "balanced_accuracy", "macro_f1", "auc"]
  calibration_metrics: ["nll", "brier", "ece"]

output:
  output_dir: "outputs/experiments/session_multisource_v1"
  checkpoint_dir: "checkpoints/session_multisource_v1"
