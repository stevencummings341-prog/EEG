run_id: alignment_baseline_v1
experiment_id: alignment_baseline_v1
data:
  variant: eog_ecg_clean
  manifest: processed_manifest
  status_filter:
  - ok
  n_channels: 58
  n_times: 1000
  n_classes: 2
  sfreq: 250
methods:
- session_zscore
- euclidean_alignment
- riemannian_alignment
- bn_statistics_adaptation
- filterbank_reweighting
models:
- eegnet
- deepconvnet
- fbcnet
protocols:
- single
- multi
multisource:
  train_sessions:
  - ses-01
  - ses-02
  test_session: ses-03
alignment:
  eps: 1.0e-05
  shrinkage: 0.1
  zscore_eps: 1.0e-08
  filterbank:
    bands:
    - - 4.0
      - 8.0
    - - 8.0
      - 13.0
    - - 13.0
      - 30.0
    - - 30.0
      - 40.0
    taps: 125
    w_min: 0.5
    w_max: 2.0
train:
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0
  optimizer: adam
  max_epochs: 100
  early_stopping_patience: 20
  early_stopping_metric: val_loss
  val_fraction: 0.2
  num_workers: 2
  device: cuda
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
model_params:
  eegnet:
    F1: 8
    D: 2
    F2: 16
    kernel_length: 64
    dropout: 0.25
  deepconvnet:
    dropout: 0.5
    n_filters_1: 25
  fbcnet:
    n_bands: 9
    band_width: 4
    f_low: 4
    f_high: 40
    m: 32
    temporal_segments: 4
    dropout: 0.5
eval:
  metrics:
  - accuracy
  - balanced_accuracy
  - macro_f1
  - auc
  calibration_metrics:
  - nll
  - brier
  - ece
output:
  output_dir: outputs/experiments/alignment_baseline_v1
  checkpoint_dir: checkpoints/alignment_baseline_v1
  baseline_cross_all: outputs/experiments/baseline_v1/cross_session/tables/results_cross_session_all.csv
  drift_per_subject: outputs/analysis/session_drift_v1/per_subject_drift_summary.csv
